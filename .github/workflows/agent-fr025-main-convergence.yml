name: FR-025 current main convergence

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: fr025-main-convergence
  cancel-in-progress: true

jobs:
  converge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout convergence branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: integration/issue-358-self-signup-main-convergence

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Cherry-pick FR-025 stack
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/issue-358-fr025-self-signup
          mapfile -t commits < <(git rev-list --reverse 8a427a244da11b19cb1d94870c4e04d3fe89057c..951011114a68e766d2b529ca6846356cce761e65)
          if [ "${#commits[@]}" -ne 2 ]; then
            printf 'Expected 2 FR-025 commits, found %s\n' "${#commits[@]}" >&2
            exit 1
          fi
          for commit in "${commits[@]}"; do
            if git cherry-pick -X theirs "$commit"; then
              continue
            fi

            while IFS= read -r path; do
              case "$path" in
                docs/generated/*|infra/test/__snapshots__/memorag-mvp-stack.snapshot.json)
                  git checkout --ours -- "$path"
                  git add -- "$path"
                  ;;
                tasks/todo/20260713-2258-self-signup-policy-implementation.md)
                  git rm -f -- "$path"
                  ;;
              esac
            done < <(git diff --name-only --diff-filter=U)

            remaining="$(git diff --name-only --diff-filter=U)"
            if [ -n "$remaining" ]; then
              printf 'Unresolved source conflicts remain:\n%s\n' "$remaining" >&2
              exit 1
            fi
            GIT_EDITOR=true git cherry-pick --continue
          done

      - name: Install dependencies
        run: npm ci

      - name: Regenerate infra snapshot and inventory
        run: |
          UPDATE_SNAPSHOTS=1 npm test -w @memorag-mvp/infra
          npm run docs:infra-inventory

      - name: Validate converged tree
        run: |
          npm run ci
          npm run docs:openapi:check
          npm run docs:api-code:check
          npm run docs:web-inventory:check
          npm run docs:infra-inventory:check
          npm run docs:hidden-unicode:check
          npm run rag:release:source-audit
          git diff --check

      - name: Remove one-time workflow and push result
        run: |
          git rm .github/workflows/agent-fr025-main-convergence.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No convergence changes to commit" >&2
            exit 1
          fi
          git commit -m "🔄 FR-025をcurrent mainへ再収束"
          git push origin HEAD:integration/issue-358-self-signup-main-convergence
